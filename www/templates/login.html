<ion-view view-title="Portal do Aluno UCSal" hide-back-button="true">
  <ion-header-bar class="bar-ucsal">
    <h1 class="title">Portal do Aluno UCSal</h1>
  </ion-header-bar>

  <ion-content class="padding">
    <div class="list">
      <label class="item item-input">
        <span class="input-label">Matrícula</span>
        <input type="text" ng-model="dados.matricula" placeholder="Ex.: 20261001">
      </label>
      <label class="item item-input">
        <span class="input-label">Senha</span>
        <input type="password" ng-model="dados.senha" placeholder="Sua senha">
      </label>
    </div>

    <p class="mensagem-erro" ng-if="erro">{{erro}}</p>

    <button class="button button-block button-ucsal" ng-click="entrar()">Entrar</button>
  </ion-content>
</ion-view>
